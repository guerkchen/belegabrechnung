<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belegabrechnung</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; }
    .status-badge { min-width: 120px; }
    .nav-link.active { font-weight: 600; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="#home">Belegabrechnung</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto" id="navLinks"></ul>
        <div class="d-flex align-items-center gap-2">
          <span class="navbar-text text-light" id="userRoleLabel"></span>
          <button id="logoutButton" class="btn btn-outline-light btn-sm d-none">Abmelden</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="content"></div>
  </main>

  <footer class="bg-light border-top mt-4">
    <div class="container py-3 d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>© 2026 Belegabrechnung</span>
      <div>
        <a href="#impressum" class="me-3">Impressum</a>
        <a href="#datenschutz">Datenschutz</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Minimal client-side HTML escape to avoid injecting untrusted error messages into DOM
    function escapeHtmlClient(input) {
      if (input === null || input === undefined) return '';
      return String(input)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    // Configuration
    const apiBase = '/api';

    // Simple token store
    function getToken() {
      return localStorage.getItem('appToken') || '';
    }
    function setToken(token) {
      if (token) localStorage.setItem('appToken', token);
    }
    function clearToken() {
      localStorage.removeItem('appToken');
    }

    // State
    let role = 'user';
    let activePage = 'home';
    let authUser = null;

    const pages = {
      user: [
        { id: 'home', label: 'Home', title: 'Übersicht', view: renderHome },
        { id: 'submit', label: 'Beleg einreichen', title: 'Beleg einreichen', view: renderSubmit },
        { id: 'mine', label: 'Meine Belege', title: 'Meine Belege', view: renderMine }
      ],
      freigeber: [
        { id: 'home', label: 'Home', title: 'Übersicht', view: renderHome },
        { id: 'submit', label: 'Beleg einreichen', title: 'Beleg einreichen', view: renderSubmit },
        { id: 'mine', label: 'Meine Belege', title: 'Meine Belege', view: renderMine },
        { id: 'approval', label: 'Belege freigeben', title: 'Belege freigeben', view: renderApproval },
        { id: 'history', label: 'Beleghistorie', title: 'Beleghistorie', view: renderHistory }
      ],
      kassenwart: [
        { id: 'home', label: 'Home', title: 'Übersicht', view: renderHome },
        { id: 'submit', label: 'Beleg einreichen', title: 'Beleg einreichen', view: renderSubmit },
        { id: 'mine', label: 'Meine Belege', title: 'Meine Belege', view: renderMine },
        { id: 'payout', label: 'Belege auszahlen', title: 'Belege auszahlen', view: renderPayout },
        { id: 'history', label: 'Beleghistorie', title: 'Beleghistorie', view: renderHistory }
      ],
      // Admin: union of all tabs (Freigeber + Kassenwart + User)
      admin: [
        { id: 'home', label: 'Home', title: 'Übersicht', view: renderHome },
        { id: 'submit', label: 'Beleg einreichen', title: 'Beleg einreichen', view: renderSubmit },
        { id: 'mine', label: 'Meine Belege', title: 'Meine Belege', view: renderMine },
        { id: 'approval', label: 'Belege freigeben', title: 'Belege freigeben', view: renderApproval },
        { id: 'payout', label: 'Belege auszahlen', title: 'Belege auszahlen', view: renderPayout },
        { id: 'history', label: 'Beleghistorie', title: 'Beleghistorie', view: renderHistory }
      ]
    };

    function getRoleLabel(roleName) {
      switch (roleName) {
        case 'freigeber': return 'Freigeber';
        case 'kassenwart': return 'Kassenwart';
        case 'admin': return 'Admin';
        default: return 'User';
      }
    }

    function apiUrl(path) {
      const normalizedPath = path.startsWith('/') ? path : `/${path}`;
      return `${apiBase}${normalizedPath}`;
    }

    async function apiRequest(path, options = {}) {
      const headers = { Accept: 'application/json' };
      const token = getToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;

      if (!(options.body instanceof FormData)) {
        headers['Content-Type'] = 'application/json';
      }

      const response = await fetch(apiUrl(path), {
        ...options,
        headers,
        body: options.body instanceof FormData ? options.body : (options.body ? JSON.stringify(options.body) : undefined)
      });

      const contentType = response.headers.get('content-type') || '';
      const payload = contentType.includes('application/json') ? (await response.json().catch(() => ({}))) : await response.text();
      if (!response.ok) {
        const errorMessage = payload && payload.error ? payload.error : (typeof payload === 'string' ? payload : 'Request failed');
        throw new Error(errorMessage);
      }
      return payload;
    }

    function renderNav() {
      const navLinks = document.getElementById('navLinks');
      const userRoleLabel = document.getElementById('userRoleLabel');
      const logoutButton = document.getElementById('logoutButton');
      if (!authUser) {
        navLinks.innerHTML = '';
        userRoleLabel.textContent = '';
        logoutButton.classList.add('d-none');
        return;
      }

      userRoleLabel.textContent = getRoleLabel(role);
      logoutButton.classList.remove('d-none');
      navLinks.innerHTML = '';

      pages[role].forEach((page) => {
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.innerHTML = `<a class="nav-link text-white ${page.id === activePage ? 'active' : ''}" href="#${page.id}">${page.label}</a>`;
        li.querySelector('a').addEventListener('click', (e) => {
          e.preventDefault();
          activePage = page.id;
          renderNav();
          page.view();
        });
        navLinks.appendChild(li);
      });
    }

    async function logout() {
      try {
        await apiRequest('/auth/logout', { method: 'POST' });
      } catch (error) {
        console.warn('Logout failed', error);
      } finally {
        clearToken();
        authUser = null;
        role = 'user';
        activePage = 'home';
        renderNav();
        renderLogin('Sie wurden abgemeldet.');
      }
    }

    function renderLogin(message = '') {
      document.title = 'Belegabrechnung – Login';
      setContent(`
        <div class="row justify-content-center">
          <div class="col-lg-5">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h4">Anmeldung</h2>
                <p class="text-muted mb-3">Melden Sie sich mit Ihrem Microsoft 365-Konto an, um die Belegabrechnung zu nutzen.</p>
                ${message ? `<div class="alert alert-warning">${escapeHtmlClient(message)}</div>` : ''}
                <button id="loginButton" class="btn btn-primary w-100">Mit Microsoft 365 anmelden</button>
              </div>
            </div>
          </div>
        </div>
      `);

      document.getElementById('loginButton').addEventListener('click', () => {
        window.location.href = apiUrl('/auth/login');
      });
    }

    function setContent(html) {
      document.getElementById('content').innerHTML = html;
    }

    function formatCurrency(value) {
      const number = Number(value || 0);
      return `€ ${number.toFixed(2).replace('.', ',')}`;
    }

    function getStatusBadge(status) {
      const map = {
        'zur_Freigabe': 'bg-warning text-dark',
        Freigegeben: 'bg-success',
        Abgelehnt: 'bg-danger',
        Ausgezahlt: 'bg-secondary'
      };
      return map[status] || 'bg-info';
    }

    function getStatusLabel(status) {
      return status || 'Unbekannt';
    }

    async function renderHome() {
      document.title = 'Belegabrechnung – Home';
      setContent('<div class="text-center py-5">Lade Übersicht…</div>');
      try {
        const response = await apiRequest('/receipts/statistics');
        const stats = response.statistics || [];
        const counts = Object.fromEntries(stats.map((item) => [item.status, Number(item.count)]));
        setContent(`
          <div class="row g-4">
            <div class="col-12">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h2 class="h4">Willkommen bei der Belegabrechnung</h2>
                  <p class="mb-0">Hier werden Belege aus der API geladen und je nach Rolle dargestellt.</p>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card shadow-sm border-primary">
                <div class="card-body">
                  <h3 class="h6 text-muted">Zur Freigabe</h3>
                  <h2 class="display-6">${counts.zur_Freigabe || 0}</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card shadow-sm border-success">
                <div class="card-body">
                  <h3 class="h6 text-muted">Freigegeben</h3>
                  <h2 class="display-6">${counts.Freigegeben || 0}</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card shadow-sm border-warning">
                <div class="card-body">
                  <h3 class="h6 text-muted">Ausgezahlt</h3>
                  <h2 class="display-6">${counts.Ausgezahlt || 0}</h2>
                </div>
              </div>
            </div>
          </div>
        `);
      } catch (error) {
        setContent(`<div class="alert alert-danger">${escapeHtmlClient(error.message)}</div>`);
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function renderSubmit() {
      document.title = 'Belegabrechnung – Beleg einreichen';
      setContent(`
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h4">Beleg einreichen</h2>
            <form id="receiptForm">
              <div class="mb-3">
                <label class="form-label">Kurze Beschreibung</label>
                <input name="description" type="text" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Betrag (€)</label>
                <input name="amount" type="number" step="0.01" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Belegdaten</label>
                <input name="receipt_date" type="date" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">PDF-Datei</label>
                <input name="file" type="file" class="form-control" accept="application/pdf" required>
              </div>
              <button class="btn btn-primary" type="submit">Einreichen</button>
            </form>
          </div>
        </div>
      `);

      document.getElementById('receiptForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        try {
          const file = formData.get('file');
          const base64 = await fileToBase64(file);
          const payload = {
            description: formData.get('description'),
            amount: String(formData.get('amount')),
            receipt_date: formData.get('receipt_date'),
            file: { name: file.name, mimeType: file.type || 'application/pdf', base64 }
          };
          const response = await apiRequest('/receipts', { method: 'POST', body: payload });
          alert(response.message || 'Beleg wurde eingereicht');
          form.reset();
        } catch (error) {
          alert(error.message);
        }
      });
    }

    async function renderMine() {
      document.title = 'Belegabrechnung – Meine Belege';
      setContent('<div class="text-center py-5">Lade Belege…</div>');
      try {
        const response = await apiRequest('/receipts/me');
        const receipts = response.receipts || [];
        const rows = receipts.map((receipt) => `
          <tr>
            <td>${receipt.description}</td>
            <td>${formatCurrency(receipt.amount_euro)}</td>
            <td><span class="badge ${getStatusBadge(receipt.status)} status-badge">${getStatusLabel(receipt.status)}</span></td>
            <td>${receipt.receipt_date}</td>
          </tr>
        `).join('');

        setContent(`
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h4">Meine Belege</h2>
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Beschreibung</th>
                      <th>Betrag</th>
                      <th>Status</th>
                      <th>Datum</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        `);
      } catch (error) {
        setContent(`<div class="alert alert-danger">${escapeHtmlClient(error.message)}</div>`);
      }
    }

    async function renderApproval() {
      document.title = 'Belegabrechnung – Belege freigeben';
      setContent('<div class="text-center py-5">Lade offene Belege…</div>');
      try {
        const response = await apiRequest('/receipts/pending-approval');
        const receipts = response.receipts || [];
        const items = receipts.map((receipt) => `
          <div class="list-group-item">
            <div class="d-flex justify-content-between flex-wrap gap-2">
              <div>
                <h5 class="mb-1">${receipt.description}</h5>
                <p class="mb-1">Eingereicht von: Benutzer #${receipt.user_id}</p>
                <small>Betrag: ${formatCurrency(receipt.amount_euro)} · Datum: ${receipt.receipt_date}</small>
              </div>
              <div>
                <button class="btn btn-success btn-sm" data-action="approve" data-id="${receipt.id}">Genehmigen</button>
                <button class="btn btn-danger btn-sm" data-action="reject" data-id="${receipt.id}">Ablehnen</button>
              </div>
            </div>
          </div>
        `).join('');

        setContent(`
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h4">Belege freigeben</h2>
              <div class="list-group">${items}</div>
            </div>
          </div>
        `);

        document.querySelectorAll('[data-action="approve"]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-id');
            try {
              await apiRequest(`/receipt/${id}/approve`, { method: 'POST' });
              await renderApproval();
            } catch (error) {
              alert(error.message);
            }
          });
        });

        document.querySelectorAll('[data-action="reject"]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-id');
            try {
              await apiRequest(`/receipt/${id}/reject`, { method: 'POST', body: { comment: 'Abgelehnt über UI' } });
              await renderApproval();
            } catch (error) {
              alert(error.message);
            }
          });
        });
      } catch (error) {
        setContent(`<div class="alert alert-danger">${escapeHtmlClient(error.message)}</div>`);
      }
    }

    async function renderPayout() {
      document.title = 'Belegabrechnung – Belege auszahlen';
      setContent('<div class="text-center py-5">Lade freigegebene Belege…</div>');
      try {
        const response = await apiRequest('/receipts/payable');
        const receipts = response.receipts || [];
        const items = receipts.map((receipt) => `
          <div class="list-group-item">
            <div class="d-flex justify-content-between flex-wrap gap-2">
              <div>
                <h5 class="mb-1">${receipt.description}</h5>
                <p class="mb-1">Freigegeben am: ${receipt.updated_at}</p>
                <small>Betrag: ${formatCurrency(receipt.amount_euro)} · Eingereicht von: Benutzer #${receipt.user_id}</small>
              </div>
              <button class="btn btn-primary btn-sm" data-action="pay" data-id="${receipt.id}">Als ausgezahlt markieren</button>
            </div>
          </div>
        `).join('');

        setContent(`
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h4">Belege auszahlen</h2>
              <div class="list-group">${items}</div>
            </div>
          </div>
        `);

        document.querySelectorAll('[data-action="pay"]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.getAttribute('data-id');
            try {
              await apiRequest(`/receipt/${id}/pay`, { method: 'POST' });
              await renderPayout();
            } catch (error) {
              alert(error.message);
            }
          });
        });
      } catch (error) {
        setContent(`<div class="alert alert-danger">${escapeHtmlClient(error.message)}</div>`);
      }
    }

    async function renderHistory() {
      document.title = 'Belegabrechnung – Beleghistorie';
      setContent('<div class="text-center py-5">Lade Historie…</div>');
      try {
        const response = await apiRequest('/receipts');
        const receipts = response.receipts || [];
        const rows = receipts.map((receipt) => `
          <tr>
            <td>${receipt.description}</td>
            <td><span class="badge ${getStatusBadge(receipt.status)}">${getStatusLabel(receipt.status)}</span></td>
            <td>${receipt.updated_at}</td>
            <td>${receipt.receipt_date}</td>
          </tr>
        `).join('');

        setContent(`
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="h4">Beleghistorie</h2>
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th>Beschreibung</th>
                      <th>Status</th>
                      <th>Letzte Änderung</th>
                      <th>Datum</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            </div>
          </div>
        `);
      } catch (error) {
        setContent(`<div class="alert alert-danger">${escapeHtmlClient(error.message)}</div>`);
      }
    }

    function parseHashParams() {
      const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
      const params = new URLSearchParams(hash);
      return Object.fromEntries(params.entries());
    }

    async function init() {
      document.getElementById('logoutButton').addEventListener('click', logout);

      // Handle auth callback via fragment
      const hashParams = parseHashParams();
      if (hashParams.auth === 'success' && hashParams.token) {
        setToken(hashParams.token);
        history.replaceState(null, document.title, window.location.pathname);
      } else if (hashParams.auth === 'error') {
        history.replaceState(null, document.title, window.location.pathname);
        renderLogin(decodeURIComponent(hashParams.message || 'Die Anmeldung ist fehlgeschlagen.'));
        return;
      }

      try {
        const response = await apiRequest('/auth/me');
        authUser = response.user;
        role = authUser.role;
        renderNav();
        const page = pages[role].find((entry) => entry.id === activePage) || pages[role][0];
        page.view();
      } catch (error) {
        console.warn('Auth failed, showing login view', error);
        renderLogin('Bitte melden Sie sich an, um fortzufahren.');
      }
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
